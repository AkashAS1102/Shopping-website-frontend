<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout – ShopNow</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><i class="fas fa-shopping-bag"></i><span>ShopNow</span></a>
      <div class="nav-actions">
        <a href="cart.html" class="icon-btn"><i class="fas fa-shopping-cart"></i><span class="badge" id="cartBadge">0</span></a>
      </div>
    </div>
  </header>

  <div class="page-hero">
    <h1>Checkout</h1>
    <nav class="breadcrumb"><a href="index.html">Home</a> <i class="fas fa-chevron-right"></i> <a href="cart.html">Cart</a> <i class="fas fa-chevron-right"></i> Checkout</nav>
  </div>

  <!-- Progress Steps -->
  <div class="checkout-steps container">
    <div class="step active"><div class="step-num">1</div><span>Address</span></div>
    <div class="step-line"></div>
    <div class="step" id="step2"><div class="step-num">2</div><span>Payment</span></div>
    <div class="step-line"></div>
    <div class="step" id="step3"><div class="step-num">3</div><span>Confirm</span></div>
  </div>

  <section class="checkout-layout container section">
    <!-- LEFT: FORMS -->
    <div class="checkout-forms">

      <!-- Step 1: Shipping -->
      <div class="checkout-section active" id="formStep1">
        <h3><i class="fas fa-map-marker-alt"></i> Shipping Address</h3>
        <form id="addressForm" class="checkout-form">
          <div class="form-row">
            <div class="form-group">
              <label>First Name *</label>
              <input type="text" id="firstName" placeholder="John" required/>
            </div>
            <div class="form-group">
              <label>Last Name *</label>
              <input type="text" id="lastName" placeholder="Doe" required/>
            </div>
          </div>
          <div class="form-group">
            <label>Email *</label>
            <input type="email" id="email" placeholder="john@email.com" required/>
          </div>
          <div class="form-group">
            <label>Phone *</label>
            <input type="tel" id="phone" placeholder="+91 98765 43210" required/>
          </div>
          <div class="form-group">
            <label>Address *</label>
            <input type="text" id="address" placeholder="123, Street Name" required/>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>City *</label>
              <input type="text" id="city" placeholder="Bangalore" required/>
            </div>
            <div class="form-group">
              <label>State *</label>
              <select id="state" required>
                <option value="">Select State</option>
                <option>Karnataka</option><option>Maharashtra</option><option>Delhi</option>
                <option>Tamil Nadu</option><option>Gujarat</option><option>Rajasthan</option>
                <option>West Bengal</option><option>Uttar Pradesh</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>PIN Code *</label>
            <input type="text" id="pincode" placeholder="560001" maxlength="6" required/>
          </div>
          <button type="submit" class="btn btn-primary">Continue to Payment <i class="fas fa-arrow-right"></i></button>
        </form>
      </div>

      <!-- Step 2: Payment -->
      <div class="checkout-section" id="formStep2">
        <h3><i class="fas fa-credit-card"></i> Payment Method</h3>
        <div class="payment-methods">
          <label class="payment-option selected">
            <input type="radio" name="payment" value="card" checked/>
            <i class="fas fa-credit-card"></i> Credit / Debit Card
          </label>
          <label class="payment-option">
            <input type="radio" name="payment" value="upi"/>
            <i class="fas fa-mobile-screen-button"></i> UPI
          </label>
          <label class="payment-option">
            <input type="radio" name="payment" value="netbanking"/>
            <i class="fas fa-university"></i> Net Banking
          </label>
          <label class="payment-option">
            <input type="radio" name="payment" value="cod"/>
            <i class="fas fa-money-bill-wave"></i> Cash on Delivery
          </label>
        </div>

        <!-- Card Form -->
        <div class="card-form" id="cardForm">
          <div class="form-group">
            <label>Card Number</label>
            <input type="text" id="cardNum" placeholder="1234 5678 9012 3456" maxlength="19"/>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Expiry</label>
              <input type="text" id="expiry" placeholder="MM/YY" maxlength="5"/>
            </div>
            <div class="form-group">
              <label>CVV</label>
              <input type="text" id="cvv" placeholder="•••" maxlength="3"/>
            </div>
          </div>
          <div class="form-group">
            <label>Name on Card</label>
            <input type="text" id="cardName" placeholder="John Doe"/>
          </div>
        </div>

        <!-- UPI Form -->
        <div class="upi-form hidden" id="upiForm">
          <div class="form-group">
            <label>UPI ID</label>
            <input type="text" placeholder="yourname@upi"/>
          </div>
        </div>

        <div class="checkout-btn-row">
          <button class="btn btn-outline" id="backToAddr"><i class="fas fa-arrow-left"></i> Back</button>
          <button class="btn btn-primary" id="placeOrder">Place Order <i class="fas fa-check"></i></button>
        </div>
      </div>

      <!-- Step 3: Confirmation -->
      <div class="checkout-section" id="formStep3">
        <div class="order-success">
          <div class="success-icon"><i class="fas fa-check-circle"></i></div>
          <h2>Order Placed Successfully!</h2>
          <p>Thank you for your order. You'll receive a confirmation email shortly.</p>
          <div class="order-id">Order ID: <strong id="orderId"></strong></div>
          <div class="success-actions">
            <a href="index.html" class="btn btn-primary">Continue Shopping</a>
            <a href="account.html" class="btn btn-outline">Track Order</a>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: ORDER SUMMARY -->
    <aside class="checkout-summary">
      <div class="summary-card">
        <h3>Order Summary</h3>
        <div id="checkoutItems" class="checkout-items-list"></div>
        <div class="summary-divider"></div>
        <div class="summary-row"><span>Subtotal</span><span id="coSubtotal">₹0</span></div>
        <div class="summary-row"><span>Delivery</span><span>₹49</span></div>
        <div class="summary-divider"></div>
        <div class="summary-row total"><span>Total</span><span id="coTotal">₹0</span></div>
      </div>
    </aside>
  </section>

  <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
